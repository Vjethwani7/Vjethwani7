[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medic"
version = "1.0.0"
description = "Diagnose and repair common problems on your computer, locally and reversibly."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["diagnostics", "system", "troubleshooting", "sysadmin", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
# No runtime dependencies on purpose: a tool you run when your machine is
# already broken should not need a working package installer first.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
medic = "medic.cli:main"

[tool.setuptools.packages.find]
include = ["medic*"]

# The dashboard's HTML/CSS/JS are part of the package, not build artefacts.
[tool.setuptools.package-data]
"medic.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
