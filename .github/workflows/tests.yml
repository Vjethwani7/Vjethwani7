name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Smoke-test the CLI
        # Diagnose exits non-zero when it finds problems, which is expected
        # on a CI runner - we only care that it runs and emits valid JSON.
        run: |
          python -m medic list
          python -m medic diagnose --offline --json > result.json || true
          python -c "import json; d=json.load(open('result.json')); assert d['schema']==1; print(d['counts'])"
          python -m medic fix --all
        shell: bash
